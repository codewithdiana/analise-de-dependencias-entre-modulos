<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body>
<script>

/* Ponte de Comunicação Bidirecional entre o front-end customizado e o ciclo reativo do Streamlit. */
(function() {
  var p = window.parent.document;
  if (p.getElementById('depgraph-fab')) {
    var msgs = p.getElementById('dg-messages');
    if (msgs) {
      msgs.innerHTML = '';
      __CHAT_MSGS__
      msgs.scrollTop = msgs.scrollHeight;
    }
    if (__DRAWER_OPEN__) {
      var drawer = p.getElementById('depgraph-drawer');
      if (drawer && !drawer.classList.contains('dg-open')) {
        drawer.classList.add('dg-open');
        p.getElementById('depgraph-overlay').classList.add('dg-open');
        p.getElementById('depgraph-fab').style.display = 'none';
      }
    }
    return;
  }

  // ── CSS ──────────────────────────────────────────────────
  var style = p.createElement('style');
  style.innerHTML = `
    #depgraph-fab {
      position: fixed !important; bottom: 28px !important; right: 28px !important;
      z-index: 99999 !important;
      background: linear-gradient(135deg, #1F6FEB, #58A6FF);
      color: white; border: none; border-radius: 50px;
      padding: 13px 20px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 18px rgba(31,111,235,0.55);
      display: flex !important; align-items: center; gap: 8px;
      font-family: Inter, sans-serif;
      transition: transform .2s, box-shadow .2s;
    }
    #depgraph-fab:hover { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(31,111,235,0.7); }
    #depgraph-drawer {
      position: fixed !important; top: 0 !important; right: 0 !important;
      width: 380px !important; height: 100vh !important;
      background: #161B22; border-left: 1px solid #30363D;
      box-shadow: -6px 0 32px rgba(0,0,0,0.5);
      display: flex !important; flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 99998 !important; font-family: Inter, sans-serif;
    }
    #depgraph-drawer.dg-open { transform: translateX(0) !important; }
    #depgraph-drawer.dg-mini { height: 54px !important; overflow: hidden !important; }
    #depgraph-overlay {
      position: fixed !important; inset: 0 !important;
      background: rgba(0,0,0,0.35); z-index: 99997 !important; display: none !important;
    }
    #depgraph-overlay.dg-open { display: block !important; }
    .dg-header {
      background: #0D1117; border-bottom: 1px solid #30363D;
      padding: 14px 16px; display: flex; justify-content: space-between;
      align-items: center; flex-shrink: 0;
    }
    .dg-title { color: #58A6FF; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .dg-btns { display: flex; gap: 6px; }
    .dg-btn {
      background: none; border: 1px solid #30363D; color: #8B949E;
      border-radius: 6px; width: 30px; height: 30px; cursor: pointer;
      font-size: 1rem; display: flex; align-items: center; justify-content: center;
      transition: all .2s; font-family: Inter, sans-serif;
    }
    .dg-btn:hover { color: white; border-color: #8B949E; background: #21262D; }
    #dg-messages {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      scrollbar-width: thin; scrollbar-color: #30363D transparent;
    }
    .dg-msg-wrap { display: flex; flex-direction: column; }
    .dg-msg-wrap.user { align-items: flex-end; }
    .dg-msg-wrap.ia { align-items: flex-start; }
    .dg-label { font-size: 0.68rem; color: #8B949E; margin-bottom: 3px; }
    .dg-label.right { text-align: right; }
    .dg-bubble {
      max-width: 85%; padding: 9px 13px; border-radius: 12px;
      font-size: 0.86rem; line-height: 1.5; word-wrap: break-word;
    }
    .dg-bubble.user { background: #1F6FEB; color: white; border-radius: 12px 12px 3px 12px; }
    .dg-bubble.ia { background: #21262D; color: #C9D1D9; border-left: 3px solid #58A6FF; border-radius: 12px 12px 12px 3px; }
    .dg-typing { color: #58A6FF; font-size: 0.8rem; padding: 4px 2px; }
    .dg-suggestions {
      padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 6px;
      border-top: 1px solid #30363D; flex-shrink: 0;
    }
    .dg-sug {
      background: #21262D; border: 1px solid #30363D; color: #8B949E;
      border-radius: 20px; padding: 4px 11px; font-size: 0.74rem;
      cursor: pointer; transition: all .2s; font-family: Inter, sans-serif;
    }
    .dg-sug:hover { border-color: #58A6FF; color: #58A6FF; }
    .dg-input-area {
      padding: 10px 14px; border-top: 1px solid #30363D;
      display: flex; gap: 8px; background: #0D1117; flex-shrink: 0;
    }
    .dg-textarea {
      flex: 1; background: #21262D; border: 1px solid #30363D; border-radius: 8px;
      padding: 9px 12px; color: #C9D1D9; font-size: 0.86rem; resize: none;
      outline: none; font-family: Inter, sans-serif; transition: border-color .2s;
    }
    .dg-textarea:focus { border-color: #58A6FF; }
    .dg-send {
      background: #1F6FEB; border: none; border-radius: 8px; color: white;
      padding: 9px 14px; cursor: pointer; font-size: 1rem;
      transition: background .2s; flex-shrink: 0;
    }
    .dg-send:hover { background: #58A6FF; }
    @media (max-width: 500px) { #depgraph-drawer { width: 100vw !important; } }
  `;
  p.head.appendChild(style);

  // ── OVERLAY ──────────────────────────────────────────────
  var overlay = p.createElement('div');
  overlay.id = 'depgraph-overlay';
  overlay.onclick = function() { window.dgClose(); };
  p.body.appendChild(overlay);

  // ── DRAWER ───────────────────────────────────────────────
  var drawer = p.createElement('div');
  drawer.id = 'depgraph-drawer';
  drawer.innerHTML = `
    <div class="dg-header">
      <div class="dg-title">🤖 Agente IA — DepGraph</div>
      <div class="dg-btns">
        <button class="dg-btn" id="dg-mini-btn" title="Minimizar" onclick="window.dgToggleMini()">∨</button>
        <button class="dg-btn" title="Fechar" onclick="window.dgClose()">✕</button>
      </div>
    </div>
    <div id="dg-messages"></div>
    <div class="dg-suggestions">
      <button class="dg-sug" onclick="window.dgSug('Quais módulos são mais críticos?')">Módulos críticos</button>
      <button class="dg-sug" onclick="window.dgSug('Existem ciclos? Como resolver?')">Ciclos</button>
      <button class="dg-sug" onclick="window.dgSug('Explique a ordenação topológica.')">Ordenação</button>
    </div>
    <div class="dg-input-area">
      <textarea class="dg-textarea" id="dg-input" rows="1" placeholder="Pergunte sobre o projeto..."
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();window.dgSend();}"></textarea>
      <button class="dg-send" onclick="window.dgSend()">➤</button>
    </div>
  `;
  p.body.appendChild(drawer);

  // ── FAB ──────────────────────────────────────────────────
  var fab = p.createElement('button');
  fab.id = 'depgraph-fab';
  fab.innerHTML = '🤖 Assistente IA';
  fab.onclick = function() { window.dgOpen(); };
  p.body.appendChild(fab);

  // ── FUNÇÕES GLOBAIS ───────────────────────────────────────
  var isMini = false;

  function addMsgEl(role, html) {
    var msgs = p.getElementById('dg-messages');
    var wrap = p.createElement('div');
    wrap.className = 'dg-msg-wrap ' + role;
    var label = role === 'user'
      ? '<div class="dg-label right">Você</div>'
      : '<div class="dg-label">🤖 IA</div>';
    wrap.innerHTML = label + '<div class="dg-bubble ' + role + '">' + html + '</div>';
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  window.addMsg = function(role, html) { addMsgEl(role, html); };

  window.dgOpen = function() {
    p.getElementById('depgraph-drawer').classList.add('dg-open');
    p.getElementById('depgraph-overlay').classList.add('dg-open');
    p.getElementById('depgraph-fab').style.display = 'none';
    setTimeout(function() {
      var inp = p.getElementById('dg-input');
      if (inp) inp.focus();
      var msgs = p.getElementById('dg-messages');
      if (msgs) msgs.scrollTop = msgs.scrollHeight;
    }, 320);
  };

  window.dgClose = function() {
    var drawer = p.getElementById('depgraph-drawer');
    var overlay = p.getElementById('depgraph-overlay');
    var fab = p.getElementById('depgraph-fab');
    if(drawer) drawer.classList.remove('dg-open', 'dg-mini');
    if(overlay) overlay.classList.remove('dg-open');
    if(fab) fab.style.display = 'flex';
    isMini = false;
    var miniBtn = p.getElementById('dg-mini-btn');
    if(miniBtn) miniBtn.textContent = '∨';
  };

  window.dgToggleMini = function() {
    isMini = !isMini;
    var dr = p.getElementById('depgraph-drawer');
    var btn = p.getElementById('dg-mini-btn');
    if (isMini) { dr.classList.add('dg-mini'); btn.textContent = '∧'; }
    else { dr.classList.remove('dg-mini'); btn.textContent = '∨'; var m = p.getElementById('dg-messages'); if(m) m.scrollTop = m.scrollHeight; }
  };

  window.dgSug = function(text) {
    var inp = p.getElementById('dg-input');
    if (inp) inp.value = text;
    window.dgSend();
  };

  window.dgSend = function() {
    var inp = p.getElementById('dg-input');
    var text = inp ? inp.value.trim() : '';
    if (!text) return;
    inp.value = '';
    addMsgEl('user', text.replace(/</g,'&lt;').replace(/>/g,'&gt;'));

    var msgs = p.getElementById('dg-messages');
    var typing = p.createElement('div');
    typing.className = 'dg-typing'; typing.id = 'dg-typing';
    typing.textContent = '🤖 digitando...';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;

    var stInput = p.querySelector('input[data-testid="stTextInput"], input[aria-label="chat_ponte"]');
    if (!stInput) {
      var allInputs = p.querySelectorAll('input[type="text"]');
      for (var i = 0; i < allInputs.length; i++) {
        if (allInputs[i].value === '' || allInputs[i].getAttribute('aria-label') === 'chat_ponte') {
          stInput = allInputs[i];
          break;
        }
      }
    }
    if (stInput) {
      var nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.parent.HTMLInputElement.prototype, 'value').set;
      nativeInputValueSetter.call(stInput, text);
      stInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
  };
})();
</script>
</body>
</html>
